<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit - Gestion Mots de Passe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand"><img src="img/logo-province.png" alt="Logo">Gestion MDP</a>
        <div class="navbar-nav">
            <a href="/index.html">Dashboard</a>
            <a href="/serveurs.html">Serveurs</a>
            <a href="/switches.html">Switches</a>
            <a href="/systemes-internes.html">Systèmes Internes</a>
            <a href="/systemes-externes.html">Systèmes Externes</a>
            <a href="/divisions.html">Divisions</a>
            <a href="/notifications.html">Notifications <span id="notifBadge" class="badge-notif" style="display:none;">0</span></a>
            <a href="/audit.html" class="active">Audit</a>
        </div>
        <div class="navbar-right">
            <span id="nomUtilisateur"></span>
            <button class="theme-toggle" onclick="toggleTheme()" title="Mode sombre"><span id="themeIcon">🌙</span></button>
            <button class="btn-logout" onclick="deconnecter()">Déconnexion</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Journal d'Audit</h1>
            <button class="btn btn-secondary" onclick="chargerListe()">Actualiser</button>
        </div>

        <div id="alertErreur" class="alert alert-danger" style="display:none;"></div>
        <div id="alertInfo" class="alert alert-info" style="display:none;">Chargement...</div>

        <div class="card">
            <div class="card-header">Dernières actions (100)</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Date</th><th>Action</th><th>Entité</th><th>ID</th><th>Utilisateur</th><th>Détails</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    async function chargerListe() {
        const info = document.getElementById('alertInfo');
        info.style.display = 'block';
        try {
            const res = await API.getAudit();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            res.data.forEach(a => {
                tbody.innerHTML += '<tr>' +
                    '<td>' + (a.date ? new Date(a.date).toLocaleString('fr-FR') : '') + '</td>' +
                    '<td><strong>' + a.action + '</strong></td>' +
                    '<td>' + (a.entite||'') + '</td>' +
                    '<td>' + (a.idEntite||'') + '</td>' +
                    '<td>' + a.idUtilisateur + '</td>' +
                    '<td>' + (a.details||'') + '</td>' +
                '</tr>';
            });
            if (res.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--gray);">Aucune entrée d\'audit</td></tr>';
            }
            info.style.display = 'none';
        } catch (e) { info.style.display = 'none'; afficherErreur('Erreur chargement audit (réservé admin)'); }
    }

    function deconnecter() { fetch('/api/logout',{method:'POST',credentials:'include'}).then(()=>window.location.href='/login.html'); }

    document.addEventListener('DOMContentLoaded', chargerListe);
    </script>
</body>
</html>
