<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisions - Gestion Mots de Passe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand"><img src="img/logo-province.png" alt="Logo">Gestion MDP</a>
        <div class="navbar-nav">
            <a href="/index.html">Dashboard</a>
            <a href="/serveurs.html">Serveurs</a>
            <a href="/switches.html">Switches</a>
            <a href="/systemes-internes.html">Systèmes Internes</a>
            <a href="/systemes-externes.html">Systèmes Externes</a>
            <a href="/divisions.html" class="active">Divisions</a>
            <a href="/notifications.html">Notifications <span id="notifBadge" class="badge-notif" style="display:none;">0</span></a>
            <a href="/audit.html">Audit</a>
        </div>
        <div class="navbar-right">
            <span id="nomUtilisateur"></span>
            <button class="theme-toggle" onclick="toggleTheme()" title="Mode sombre"><span id="themeIcon">🌙</span></button>
            <button class="btn-logout" onclick="deconnecter()">Déconnexion</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Gestion des Divisions</h1>
        </div>

        <div id="alertSucces" class="alert alert-success" style="display:none;"></div>
        <div id="alertErreur" class="alert alert-danger" style="display:none;"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <!-- Divisions Internes -->
            <div class="card">
                <div class="card-header">
                    <span>Divisions Internes</span>
                </div>
                <div class="card-body">
                    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                        <input id="inputInterne" class="form-control" placeholder="Nom de la division interne" style="flex:1;min-width:150px;">
                        <input id="inputService" class="form-control" placeholder="Service" style="flex:1;min-width:150px;">
                        <button class="btn btn-primary" onclick="ajouterInterne()">Ajouter</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>ID</th><th>Nom</th><th>Service</th><th>Actions</th></tr></thead>
                            <tbody id="tableInternes"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Divisions Externes -->
            <div class="card">
                <div class="card-header">
                    <span>Divisions Externes</span>
                </div>
                <div class="card-body">
                    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                        <input id="inputExterne" class="form-control" placeholder="Nom de la division externe" style="flex:1;">
                        <select id="inputType" class="form-control" style="width:140px;" onchange="changerTypeExterne()">
                            <option value="">-- Type --</option>
                            <option value="AAL">AAL</option>
                            <option value="Commune">Commune</option>
                            <option value="Pashalik">Pashalik</option>
                            <option value="District">District</option>
                        </select>
                        <select id="inputSousType" class="form-control" style="width:160px;display:none;">
                            <option value="">-- Sous-type --</option>
                        </select>
                        <input id="inputCaidat" class="form-control" placeholder="Caïdat" style="width:160px;display:none;">
                        <button class="btn btn-primary" onclick="ajouterExterne()">Ajouter</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>ID</th><th>Nom</th><th>Type</th><th>Sous-type</th><th>Caïdat</th><th>Actions</th></tr></thead>
                            <tbody id="tableExternes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    const SOUS_TYPES = {
        AAL: ['District 1', 'District 2', 'District 3'],
        Commune: ['Abda', 'Gzoula', 'Hrara'],
        Pashalik: ['SAFI', 'Gzoula', 'jemaa shaim'],
        District: ['District 1', 'District 2', 'District 3']
    };

    function changerTypeExterne() {
        const type = document.getElementById('inputType').value;
        const sousTypeSel = document.getElementById('inputSousType');
        const caidatInput = document.getElementById('inputCaidat');

        sousTypeSel.innerHTML = '<option value="">-- Sous-type --</option>';
        sousTypeSel.style.display = 'none';
        caidatInput.style.display = 'none';
        caidatInput.value = '';

        if (type) {
            const sts = SOUS_TYPES[type] || [];
            sts.forEach(st => {
                sousTypeSel.innerHTML += '<option value="' + st + '">' + st + '</option>';
            });
            sousTypeSel.style.display = 'inline-block';
        }

        sousTypeSel.value = '';
    }

    function changerSousType() {
        const type = document.getElementById('inputType').value;
        const caidatInput = document.getElementById('inputCaidat');
        if (type === 'Commune') {
            caidatInput.style.display = 'inline-block';
        } else {
            caidatInput.style.display = 'none';
            caidatInput.value = '';
        }
    }

    async function chargerInternes() {
        try {
            const res = await API.getDivisionsInternes();
            const tbody = document.getElementById('tableInternes');
            tbody.innerHTML = '';
            res.data.forEach(d => {
                tbody.innerHTML += '<tr>' +
                    '<td>' + d.id + '</td>' +
                    '<td>' + d.nom + '</td>' +
                    '<td>' + (d.service||'') + '</td>' +
                    '<td class="action-btns">' +
                        '<button class="btn btn-sm btn-warning" onclick="ouvrirModifInterne(' + d.id + ')">✏️ Modifier</button>' +
                        '<button class="btn btn-sm btn-danger" onclick="supprimerInterne(' + d.id + ')">🗑️ Supprimer</button>' +
                    '</td></tr>';
            });
            if (res.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--gray);">Aucune division interne</td></tr>';
            }
        } catch (e) { afficherErreur('Erreur chargement divisions internes'); }
    }

    async function chargerExternes() {
        try {
            const res = await API.getDivisionsExternes();
            const tbody = document.getElementById('tableExternes');
            tbody.innerHTML = '';
            res.data.forEach(d => {
                tbody.innerHTML += '<tr>' +
                    '<td>' + d.id + '</td>' +
                    '<td>' + d.nom + '</td>' +
                    '<td>' + d.type + '</td>' +
                    '<td>' + (d.sousType||'') + '</td>' +
                    '<td>' + (d.caidatNom||'') + '</td>' +
                    '<td class="action-btns">' +
                        '<button class="btn btn-sm btn-warning" onclick="ouvrirModifExterne(' + d.id + ')">✏️ Modifier</button>' +
                        '<button class="btn btn-sm btn-danger" onclick="supprimerExterne(' + d.id + ')">🗑️ Supprimer</button>' +
                    '</td></tr>';
            });
            if (res.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--gray);">Aucune division externe</td></tr>';
            }
        } catch (e) { afficherErreur('Erreur chargement divisions externes'); }
    }

    async function ajouterInterne() {
        const nom = document.getElementById('inputInterne').value.trim();
        const service = document.getElementById('inputService').value.trim();
        if (!nom) { afficherErreur('Veuillez saisir un nom'); return; }
        try {
            await API.ajouterDivisionInterne({ nom, service });
            document.getElementById('inputInterne').value = '';
            document.getElementById('inputService').value = '';
            afficherSucces('Division interne ajoutée');
            chargerInternes();
        } catch (e) { afficherErreur(e.message); }
    }

    async function ajouterExterne() {
        const nom = document.getElementById('inputExterne').value.trim();
        const type = document.getElementById('inputType').value;
        const sousType = document.getElementById('inputSousType').value;
        const caidat = document.getElementById('inputCaidat').value.trim();

        if (!nom) { afficherErreur('Veuillez saisir un nom'); return; }
        if (!type) { afficherErreur('Veuillez choisir un type'); return; }
        if (!sousType) { afficherErreur('Veuillez choisir un sous-type'); return; }
        if (type === 'Commune' && !caidat) { afficherErreur('Veuillez saisir le caïdat'); return; }

        try {
            await API.ajouterDivisionExterne({ nom, type, sousType, caidatNom: caidat });
            document.getElementById('inputExterne').value = '';
            document.getElementById('inputType').value = '';
            document.getElementById('inputSousType').value = '';
            document.getElementById('inputSousType').style.display = 'none';
            document.getElementById('inputCaidat').value = '';
            document.getElementById('inputCaidat').style.display = 'none';
            afficherSucces('Division externe ajoutée');
            chargerExternes();
        } catch (e) { afficherErreur(e.message); }
    }

    function ouvrirModifInterne(id) {
        const nom = prompt('Nouveau nom pour la division interne :');
        if (!nom || !nom.trim()) return;
        const service = prompt('Nouveau service :');
        API.modifierDivisionInterne(id, { nom: nom.trim(), service: service ? service.trim() : '' }).then(() => {
            afficherSucces('Division interne modifiée');
            chargerInternes();
        }).catch(e => afficherErreur(e.message));
    }

    function ouvrirModifExterne(id) {
        const nom = prompt('Nouveau nom :');
        if (!nom || !nom.trim()) return;
        const type = prompt('Nouveau type (AAL, Commune, Pashalik, District) :');
        if (!type || !type.trim()) return;
        const sousType = prompt('Nouveau sous-type :');
        const caidat = prompt('Caïdat (si Commune, laisser vide sinon) :');
        API.modifierDivisionExterne(id, {
            nom: nom.trim(),
            type: type.trim(),
            sousType: sousType || null,
            caidatNom: caidat || null
        }).then(() => {
            afficherSucces('Division externe modifiée');
            chargerExternes();
        }).catch(e => afficherErreur(e.message));
    }

    async function supprimerInterne(id) {
        if (!confirm('Supprimer cette division interne ?')) return;
        try { await API.supprimerDivisionInterne(id); afficherSucces('Division interne supprimée'); chargerInternes(); }
        catch (e) { afficherErreur(e.message); }
    }

    async function supprimerExterne(id) {
        if (!confirm('Supprimer cette division externe ?')) return;
        try { await API.supprimerDivisionExterne(id); afficherSucces('Division externe supprimée'); chargerExternes(); }
        catch (e) { afficherErreur(e.message); }
    }

    function deconnecter() { fetch('/api/logout',{method:'POST',credentials:'include'}).then(()=>window.location.href='/login.html'); }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('inputSousType').addEventListener('change', changerSousType);
        chargerInternes();
        chargerExternes();
    });
    </script>
</body>
</html>
