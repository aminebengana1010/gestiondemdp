<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switches - Gestion Mots de Passe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand"><img src="img/logo-province.png" alt="Logo">Gestion MDP</a>
        <div class="navbar-nav">
            <a href="/index.html">Dashboard</a>
            <a href="/serveurs.html">Serveurs</a>
            <a href="/switches.html" class="active">Switches</a>
            <a href="/systemes-internes.html">Systèmes Internes</a>
            <a href="/systemes-externes.html">Systèmes Externes</a>
            <a href="/divisions.html">Divisions</a>
            <a href="/notifications.html">Notifications <span id="notifBadge" class="badge-notif" style="display:none;">0</span></a>
            <a href="/audit.html">Audit</a>
        </div>
        <div class="navbar-right">
            <span id="nomUtilisateur"></span>
            <button class="theme-toggle" onclick="toggleTheme()" title="Mode sombre"><span id="themeIcon">🌙</span></button>
            <button class="btn-logout" onclick="deconnecter()">Déconnexion</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Gestion des Switches Réseau</h1>
            <div>
                <button class="btn btn-secondary" onclick="API.exporterSwitchesCSV()">CSV</button>
                <button class="btn btn-secondary" onclick="API.exporterSwitchesPDF()">PDF</button>
                <button class="btn btn-primary" onclick="ouvrirModal('modalAjout')">+ Nouveau switch</button>
            </div>
        </div>

        <div id="alertSucces" class="alert alert-success" style="display:none;"></div>
        <div id="alertErreur" class="alert alert-danger" style="display:none;"></div>

        <div class="card">
            <div class="card-header">Liste des switches</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Nom</th><th>Adresse MAC</th><th>Emplacement</th><th>Login</th><th>Mot de passe</th><th>Actions</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ajout -->
    <div id="modalAjout" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><h2>Nouveau switch</h2><button class="modal-close" onclick="fermerModal('modalAjout')">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Nom</label><input id="ajoutNom" class="form-control"></div>
                <div class="form-group"><label>Adresse MAC</label><input id="ajoutMac" class="form-control" placeholder="AA:BB:CC:DD:EE:FF"></div>
                <div class="form-group"><label>Emplacement</label><input id="ajoutEmplacement" class="form-control"></div>
                <div class="form-group"><label>Login</label><input id="ajoutLogin" class="form-control"></div>
                <div class="form-group"><label>Mot de passe</label><input id="ajoutMdp" type="password" class="form-control" required></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="fermerModal('modalAjout')">Annuler</button>
                <button class="btn btn-primary" onclick="ajouter()">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- Modal Modifier -->
    <div id="modalModif" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><h2>Modifier le switch</h2><button class="modal-close" onclick="fermerModal('modalModif')">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="modifId">
                <div class="form-group"><label>Nom</label><input id="modifNom" class="form-control"></div>
                <div class="form-group"><label>Adresse MAC</label><input id="modifMac" class="form-control"></div>
                <div class="form-group"><label>Emplacement</label><input id="modifEmplacement" class="form-control"></div>
                <div class="form-group"><label>Login</label><input id="modifLogin" class="form-control"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="fermerModal('modalModif')">Annuler</button>
                <button class="btn btn-primary" onclick="modifier()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modal Mot de passe -->
    <div id="modalMdp" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><h2>Modifier le mot de passe</h2><button class="modal-close" onclick="fermerModal('modalMdp')">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="mdpId">
                <div class="form-group"><label>Nouveau mot de passe</label><input id="mdpValue" type="password" class="form-control" required></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="fermerModal('modalMdp')">Annuler</button>
                <button class="btn btn-primary" onclick="changerMdp()">Changer</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    async function chargerListe() {
        try {
            const res = await API.getSwitches();
            document.getElementById('tableBody').innerHTML = '';
            res.data.forEach(s => {
                document.getElementById('tableBody').innerHTML += '<tr>' +
                    '<td>' + s.nom + '</td>' +
                    '<td>' + (s.adresseMac||'') + '</td>' +
                    '<td>' + (s.emplacement||'') + '</td>' +
                    '<td>' + (s.login||'') + '</td>' +
                    '<td class="pwd-masked">' + (s.motDePasse||'') + '</td>' +
                    '<td class="action-btns">' +
                        (window.utilisateurRole === 'Administrateur' ? '<button class="btn btn-sm btn-info" onclick="consulterSecret(' + s.id + ')">🔑 Voir</button>' : '') +
                        '<button class="btn btn-sm btn-warning" onclick="ouvrirModif(' + s.id + ')">✏️ Modifier</button>' +
                        '<button class="btn btn-sm btn-secondary" onclick="ouvrirMdp(' + s.id + ')">🔒 Changer MDP</button>' +
                        '<button class="btn btn-sm btn-danger" onclick="supprimer(' + s.id + ')">🗑️ Supprimer</button>' +
                    '</td></tr>';
            });
        } catch (e) { afficherErreur('Erreur chargement'); }
    }

    async function ajouter() {
        try {
            await API.ajouterSwitch({
                nom: document.getElementById('ajoutNom').value,
                adresseMac: document.getElementById('ajoutMac').value,
                emplacement: document.getElementById('ajoutEmplacement').value,
                login: document.getElementById('ajoutLogin').value,
                motDePasse: document.getElementById('ajoutMdp').value
            });
            fermerModal('modalAjout');
            afficherSucces('Switch ajouté');
            chargerListe();
        } catch (e) { afficherErreur(e.message); }
    }

    async function modifier() {
        const id = document.getElementById('modifId').value;
        try {
            await API.modifierSwitch(id, {
                nom: document.getElementById('modifNom').value,
                adresseMac: document.getElementById('modifMac').value,
                emplacement: document.getElementById('modifEmplacement').value,
                login: document.getElementById('modifLogin').value
            });
            fermerModal('modalModif');
            afficherSucces('Switch modifié');
            chargerListe();
        } catch (e) { afficherErreur(e.message); }
    }

    async function consulterSecret(id) {
        try {
            const res = await API.consulterSecretSwitch(id);
            alert('Mot de passe: ' + (res.data.motDePasse || '(aucun)'));
        } catch (e) { afficherErreur(e.message); }
    }

    async function changerMdp() {
        const id = document.getElementById('mdpId').value;
        const mdp = document.getElementById('mdpValue').value;
        if (mdp.length < 8) { afficherErreur('Minimum 8 caractères'); return; }
        try {
            await API.modifierMotDePasseSwitch(id, { motDePasse: mdp });
            fermerModal('modalMdp');
            afficherSucces('Mot de passe modifié');
        } catch (e) { afficherErreur(e.message); }
    }

    async function supprimer(id) {
        if (!confirm('Supprimer ce switch ?')) return;
        try { await API.supprimerSwitch(id); afficherSucces('Switch supprimé'); chargerListe(); } catch (e) { afficherErreur(e.message); }
    }

    function ouvrirModif(id) {
        document.getElementById('modifId').value = id;
        const row = event.target.closest('tr');
        const cells = row.querySelectorAll('td');
        document.getElementById('modifNom').value = cells[0].textContent;
        document.getElementById('modifMac').value = cells[1].textContent;
        document.getElementById('modifEmplacement').value = cells[2].textContent;
        document.getElementById('modifLogin').value = cells[3].textContent;
        ouvrirModal('modalModif');
    }

    function ouvrirMdp(id) { document.getElementById('mdpId').value = id; document.getElementById('mdpValue').value = ''; ouvrirModal('modalMdp'); }
    function deconnecter() { fetch('/api/logout', {method:'POST',credentials:'include'}).then(()=>window.location.href='/login.html'); }

    document.addEventListener('DOMContentLoaded', chargerListe);
    </script>
</body>
</html>
