<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion Mots de Passe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <img src="img/logo-province.png" alt="Logo Province de Safi" class="login-logo">
            <h1>Gestion des Mots de Passe</h1>
            <p class="subtitle">Province de Safi - SSICTD</p>
            <div id="alert" class="alert alert-danger" style="display:none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login">Nom d'utilisateur</label>
                    <input type="text" id="login" class="form-control" placeholder="admin" required autofocus>
                </div>
                <div class="form-group">
                    <label for="motDePasse">Mot de passe</label>
                    <input type="password" id="motDePasse" class="form-control" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
            <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--gray);">
                Compte par défaut: admin / admin123
            </p>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Connexion...';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: document.getElementById('login').value,
                    motDePasse: document.getElementById('motDePasse').value
                })
            });
            const data = await res.json();

            if (res.ok && data.succes) {
                window.location.href = '/index.html';
            } else {
                const alert = document.getElementById('alert');
                alert.textContent = data.erreur || 'Erreur de connexion';
                alert.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        } catch (err) {
            const alert = document.getElementById('alert');
            alert.textContent = 'Erreur de connexion au serveur';
            alert.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Se connecter';
        }
    });
    </script>
</body>
</html>
